name: Moodist
version: 3.0.2
slug: moodist
description: Layer ambient sounds and play them in your browser or on Home Assistant speakers.
url: https://github.com/jpinz/moodist
image: ghcr.io/jpinz/moodist
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8080
panel_admin: false
panel_icon: mdi:forest
panel_title: Moodist
homeassistant_api: true
startup: application
stage: stable
watchdog: http://[HOST]:[PORT:8080]/health
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Audio stream for Home Assistant media players
options:
  audio_url: ""
schema:
  audio_url: str?
